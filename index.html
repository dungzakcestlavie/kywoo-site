<style>
:root{
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --safe-left: env(safe-area-inset-left, 0px);
  --safe-right: env(safe-area-inset-right, 0px);

  --bg-deep:#0b1f1c;
  --bg-main:#102c28;
  --bg-soft:#183c36;

  --gold:#d4b46d;
  --gold-strong:#d8bd73;
  --gold-soft:rgba(212,180,109,0.66);

  --text-main:#fff3df;
  --text-soft:rgba(255,240,210,0.74);
  --text-muted:rgba(255,240,210,0.52);

  --line:rgba(212,180,109,0.24);
  --line-soft:rgba(212,180,109,0.12);

  --header-bar:78px;
  --header-height:calc(var(--header-bar) + var(--safe-top));
  --maxw:1120px;
}

*{box-sizing:border-box}

html,
body{
  margin:0;
  width:100%;
  min-height:100%;
  max-width:100%;
  overflow-x:hidden;
}

html{
  -webkit-text-size-adjust:100%;
  scroll-behavior:smooth;
  background:#0b1f1c;
}

body{
  min-height:100vh;
  min-height:100svh;
  font-family:"Noto Serif KR", Georgia, serif;
  background:
    radial-gradient(circle at 50% 50%,
      rgba(212,180,109,0.16) 0%,
      rgba(212,180,109,0.08) 18%,
      rgba(212,180,109,0.03) 34%,
      transparent 55%
    ),
    radial-gradient(circle at 50% 50%,
      rgba(0,0,0,0) 0%,
      rgba(3,18,14,0.55) 60%,
      rgba(2,12,10,0.95) 100%
    ),
    linear-gradient(135deg,#0b1f1c 0%,#102c28 45%,#183c36 100%);
  background-attachment:fixed;
  color:var(--text-main);
  letter-spacing:0.1px;
}

body::before,
body::after{
  content:"";
  position:fixed;
  inset:-20%;
  z-index:0;
  pointer-events:none;
  will-change:transform, opacity;
}

body::before{
  background:radial-gradient(circle at 50% 50%,rgba(212,180,109,0.10) 0%,rgba(212,180,109,0.055) 20%,transparent 42%);
  opacity:0.38;
  animation:kywooLightMove 28s ease-in-out infinite alternate;
}

body::after{
  background:radial-gradient(circle at 50% 50%,rgba(212,180,109,0.07) 0%,rgba(212,180,109,0.025) 28%,transparent 50%);
  opacity:0.28;
  animation:kywooLightBreath 36s ease-in-out infinite alternate;
}

@keyframes kywooLightMove{
  0%{transform:translate3d(-0.8%, -0.8%, 0) scale(1);}
  50%{transform:translate3d(0.8%, 0.8%, 0) scale(1.025);}
  100%{transform:translate3d(-0.6%, 0.4%, 0) scale(1.01);}
}

@keyframes kywooLightBreath{
  0%{transform:translate3d(0.4%, 0.4%, 0) scale(1); opacity:0.22;}
  50%{transform:translate3d(-0.4%, -0.2%, 0) scale(1.035); opacity:0.32;}
  100%{transform:translate3d(0.2%, -0.4%, 0) scale(1.01); opacity:0.24;}
}

body.menu-open,
body.viewer-open{
  overflow:hidden;
  touch-action:none;
}

a{color:var(--gold-strong);text-decoration:none}
a:hover{text-decoration:underline}
button{font-family:"Noto Serif KR", Georgia, serif}

.ko,.en{display:block}
body.korean .en{display:none !important}
body.english .ko{display:none !important}

html[data-lang="kr"] .lang-en {
  display: none !important;
}

html[data-lang="en"] .lang-kr {
  display: none !important;
}

html[data-lang="kr"] .lang-kr,
html[data-lang="en"] .lang-en {
  display: inline !important;
}

.site{
  position:relative;
  z-index:1;
  min-height:100svh;
}

.header{
  position:sticky;
  top:0;
  z-index:50;
  min-height:var(--header-height);
  padding:calc(12px + var(--safe-top)) calc(16px + var(--safe-right)) 12px calc(16px + var(--safe-left));
  background:linear-gradient(180deg, rgba(11,31,28,0.82), rgba(11,31,28,0.42));
  border-bottom:1px solid var(--line-soft);
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
}

.header-inner{
  max-width:var(--maxw);
  margin:0 auto;
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
}

.menu-btn{
  position:absolute;
  left:0;
  top:50%;
  transform:translateY(-50%);
  width:44px;
  height:44px;
  border:1px solid var(--line);
  border-radius:14px;
  background:rgba(255,255,255,0.035);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}

.menu-btn span{
  width:22px;
  height:2px;
  margin:3px 0;
  display:block;
  background:var(--gold-strong);
}

.logo{
  border:0;
  background:transparent;
  padding:0;
  margin:0;
  color:var(--gold-strong);
  text-align:center;
  cursor:pointer;
  letter-spacing:2.4px;
  line-height:1.32;
  font-size:17px;
  font-weight:500;
  text-shadow:0 1px 0 rgba(0,0,0,0.52),0 0 18px rgba(255,226,154,0.18);
  -webkit-tap-highlight-color:transparent;
}

.logo span{
  display:block;
  margin-top:2px;
  font-size:12px;
  letter-spacing:3.2px;
  color:rgba(212,180,109,0.66);
}

.lang{
  position:absolute;
  right:0;
  top:50%;
  transform:translateY(-50%);
  display:flex;
  gap:7px;
}

.lang button{
  appearance:none;
  min-width:42px;
  height:32px;
  border:1px solid rgba(212,180,109,0.32);
  border-radius:999px;
  background:rgba(255,255,255,0.04);
  color:var(--gold);
  font-size:11px;
  letter-spacing:1px;
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}

.lang button.active{
  background:rgba(212,180,109,0.14);
  border-color:rgba(212,180,109,0.72);
  color:var(--gold-strong);
}

.menu{
  position:fixed;
  top:0;
  left:0;
  width:min(310px,84vw);
  height:100dvh;
  padding:calc(var(--safe-top) + 100px) 30px calc(42px + var(--safe-bottom));
  background:rgba(11,31,28,0.97);
  border-right:1px solid var(--line);
  box-shadow:24px 0 48px rgba(0,0,0,0.26);
  transform:translateX(-104%);
  transition:transform 0.22s cubic-bezier(.2,.8,.2,1);
  z-index:120;
}

.menu.open{transform:translateX(0)}

.menu button{
  display:block;
  width:100%;
  margin:22px 0;
  padding:0;
  border:0;
  background:transparent;
  color:var(--gold-strong);
  text-align:left;
  font-size:14px;
  letter-spacing:2.4px;
  font-weight:400;
  cursor:pointer;
}

.menu-overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.44);
  opacity:0;
  pointer-events:none;
  transition:opacity 0.18s ease;
  z-index:110;
}

.menu-overlay.show{
  opacity:1;
  pointer-events:auto;
}

main{
  width:100%;
  max-width:none;
  margin:0;
  padding:0;
  position:relative;
  z-index:1;
}

.view{
  display:none;
  min-height:calc(100svh - var(--header-height));
  text-align:center;
  background:transparent;
  border:none;
  border-radius:0;
  box-shadow:none;
  overflow:hidden;
}

.view.active{display:block}

.hero{
  min-height:calc(100svh - var(--header-height));
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:48px 22px;
}

.hero-title{
  color:#d4b46d;
  font-size:42px;
  line-height:1.45;
  letter-spacing:5px;
  font-weight:400;
  margin:0;
  text-shadow:0 1px 0 rgba(0,0,0,0.46),0 0 26px rgba(255,226,154,0.18);
}

.hero-title span{
  display:block;
  margin-top:8px;
  font-size:20px;
  letter-spacing:4px;
  color:rgba(212,180,109,0.66);
}

.text{
  color:var(--text-main);
  font-size:16px;
  line-height:2.05;
  font-weight:300;
  word-break:keep-all;
}

.section-box{
  width:100%;
  max-width:760px;
  margin:0 auto;
  padding:72px 24px;
  border:none;
  background:transparent;
  box-shadow:none;
}

h2{
  margin:0 0 34px;
  color:var(--gold-strong);
  font-size:24px;
  letter-spacing:4px;
  font-weight:400;
  text-shadow:0 1px 0 rgba(0,0,0,0.46);
}

#works{
  padding:42px 18px calc(52px + var(--safe-bottom));
  text-align:center;
}

.works-head{padding:4px 0 24px}
.works-head h2{margin-bottom:8px}

.works-note{
  color:var(--text-soft);
  font-size:13px;
  line-height:1.8;
}

.works-stage{
  width:min(1120px,100%);
  margin:10px auto 0;
}

.w-grid{
  display:grid;
  grid-template-columns:repeat(1,minmax(0,1fr));
  gap:18px;
  width:100%;
}

.w-card{
  background:
    radial-gradient(circle at 0 0, rgba(212,180,109,0.055), rgba(11,31,28,0.76)),
    linear-gradient(180deg, rgba(255,255,255,0.05), rgba(255,255,255,0.02));
  border-radius:18px;
  overflow:hidden;
  border:1px solid rgba(212,180,109,0.15);
  box-shadow:0 14px 34px rgba(0,0,0,0.32);
  cursor:pointer;
  display:flex;
  flex-direction:column;
  text-align:left;
  -webkit-tap-highlight-color:transparent;
  content-visibility:auto;
  contain-intrinsic-size:360px 520px;
}

.w-card:focus{
  outline:1px solid var(--gold-strong);
  outline-offset:4px;
}

.w-thumb{
  width:100%;
  display:block;
  object-fit:contain;
  object-position:center center;
  aspect-ratio:4/5;
  background:rgba(0,0,0,0.14);
  user-select:none;
  -webkit-user-drag:none;
}

.w-meta{
  padding:12px 12px 18px;
  border-top:1px solid rgba(255,255,255,0.06);
  background:transparent;
}

.w-title{
  font-weight:600;
  color:rgba(212,180,109,0.94);
  line-height:1.35;
  font-size:16px;
  letter-spacing:0.02em;
  text-shadow:0 1px 0 rgba(0,0,0,0.45),0 0 12px rgba(212,180,109,0.055);
  margin-bottom:6px;
}

.w-sub{
  margin-top:3px;
  font-size:14px;
  color:rgba(255,246,227,0.78);
  line-height:1.55;
  opacity:0.96;
  text-shadow:0 1px 0 rgba(0,0,0,0.38);
}

.w-msg{
  padding:20px;
  border-radius:16px;
  background:rgba(255,255,255,0.035);
  border:1px solid rgba(212,180,109,0.14);
  color:var(--text-soft);
  line-height:1.8;
}

.contact-line{margin-top:22px}

.viewer{
  position:fixed;
  inset:0;
  z-index:300;
  display:none;
  align-items:flex-start;
  justify-content:flex-start;
  background:rgba(5,14,13,0.94);
  overflow:auto;
  -webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;
  touch-action:pan-x pan-y;
  filter:none !important;
  backdrop-filter:none !important;
  -webkit-backdrop-filter:none !important;
}

.viewer.active{display:flex}

.viewer-stage{
  min-width:100%;
  min-height:100%;
  width:max-content;
  height:max-content;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:visible;
  -webkit-overflow-scrolling:touch;
  touch-action:pan-x pan-y;
  user-select:none;
}

.viewer-img{
  display:block;
  width:auto;
  max-width:92vw;
  max-height:82vh;
  height:auto;
  object-fit:contain;
  transition:none !important;
  image-rendering:auto;
  user-select:none;
  -webkit-user-select:none;
  -webkit-user-drag:none;
  touch-action:manipulation;
  filter:none !important;
  backdrop-filter:none !important;
  -webkit-backdrop-filter:none !important;
  cursor:zoom-in;
}



.viewer,
.viewer-img{
  filter:none !important;
  backdrop-filter:none !important;
  -webkit-backdrop-filter:none !important;
}

.viewer-close,
.viewer-prev,
.viewer-next{
  position:absolute;
  z-index:320;
  border:1px solid rgba(212,180,109,0.30);
  background:rgba(11,31,28,0.68);
  color:var(--gold-strong);
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}

.viewer-close{
  top:calc(14px + var(--safe-top));
  right:calc(14px + var(--safe-right));
  width:44px;
  height:44px;
  border-radius:999px;
  font-size:28px;
  line-height:1;
}

.viewer-prev,
.viewer-next{
  top:50%;
  transform:translateY(-50%);
  width:44px;
  height:58px;
  border-radius:999px;
  font-size:30px;
  line-height:1;
}

.viewer-prev{left:12px}
.viewer-next{right:12px}

.viewer-caption,
#viewerTitle,
#viewerMeta{
  display:none !important;
  visibility:hidden !important;
  opacity:0 !important;
  pointer-events:none !important;
}

@media (min-width:720px){
  .w-grid{
    grid-template-columns:repeat(3,minmax(0,1fr));
    gap:18px;
  }
}

@media (min-width:1000px){
  .w-grid{
    grid-template-columns:repeat(3,minmax(0,1fr));
    gap:20px;
  }
}

@media (max-width:640px){
  :root{--header-bar:74px}

  .header{
    padding-left:14px;
    padding-right:14px;
  }

  .menu-btn{
    width:42px;
    height:42px;
  }

  .logo{
    font-size:14px;
    letter-spacing:1.6px;
  }

  .logo span{
    font-size:10px;
    letter-spacing:2.2px;
  }

  .lang{gap:5px}

  .lang button{
    min-width:38px;
    height:30px;
    font-size:10px;
    padding:0 7px;
  }

  .hero-title{
    font-size:30px;
    letter-spacing:3px;
  }

  .hero-title span{
    font-size:15px;
    letter-spacing:2.6px;
  }

  h2{
    font-size:21px;
    letter-spacing:3px;
  }

  .text{
    font-size:15px;
    line-height:1.95;
  }

  .section-box{
    padding:62px 18px;
  }

  #works{
    padding:30px 14px calc(42px + var(--safe-bottom));
  }

  .w-grid{
    grid-template-columns:1fr;
    gap:18px;
  }

  .w-card{border-radius:16px}
  .w-meta{padding:12px 12px 18px}

  .w-title{
    font-size:15px;
    line-height:1.35;
  }

  .w-sub{
    font-size:14px;
    line-height:1.55;
  }

  .viewer-img{
    max-width:94vw;
    max-height:78dvh;
  }

  .viewer-prev,
  .viewer-next{
    display:none;
  }
}

@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,
  *::before,
  *::after{
    transition-duration:0.001ms !important;
    animation-duration:0.001ms !important;
    animation-iteration-count:1 !important;
  }
}
